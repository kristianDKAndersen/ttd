# Builds the TTD window for macOS (universal), Linux and Windows and attaches the
# bundles to a DRAFT GitHub release (a human publishes it). Unsigned builds.
# Input names checked against tauri-apps/tauri-action v1 action.yml. Never run yet.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: windows
            platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build the frontend (embedded by tauri build as frontendDist)
        run: bun run build:ui

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          # Root package.json script "tauri" is `cd app && tauri`.
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: 'TTD v__VERSION__'
          releaseBody: 'Unsigned beta build. See the README for the macOS, Windows and Linux first-launch steps.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
