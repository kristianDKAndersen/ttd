# Builds the TTD window for macOS (universal), Linux and Windows and attaches the
# bundles to a DRAFT GitHub release (a human publishes it). Unsigned builds.
# Input names checked against tauri-apps/tauri-action v1 action.yml. Never run yet.
# Order: ci (gate) -> prepare (version sync check, ONE draft release) -> build x3 (upload into that release id).
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Runs once, so the three build jobs cannot each create their own draft for the same tag.
  prepare:
    name: check versions, create the draft
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Versions agree with each other and with the pushed tag
        id: versions
        run: |
          set -euo pipefail
          tauri=$(jq -r .version app/src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          plugin=$(jq -r .version plugin/.claude-plugin/plugin.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' app/src-tauri/Cargo.toml | head -n 1)
          echo "tauri.conf.json=$tauri package.json=$pkg plugin.json=$plugin app/src-tauri/Cargo.toml=$cargo"
          for v in "$pkg" "$plugin" "$cargo"; do
            [ "$v" = "$tauri" ] || { echo "::error::version mismatch: tauri.conf.json=$tauri package.json=$pkg plugin.json=$plugin Cargo.toml=$cargo"; exit 1; }
          done
          [[ "$tauri" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "::error::not a version: $tauri"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$tauri" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version v$tauri"
            exit 1
          fi
          echo "tag=v$tauri" >> "$GITHUB_OUTPUT"

      - name: Find or create the draft release (never touches a published one)
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          set -euo pipefail
          # Drafts cannot be fetched by tag, so list them. awk (not head) reads everything: no SIGPIPE under pipefail.
          found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | awk 'NR==1')
          if [ -n "$found" ]; then
            [ "${found#* }" = true ] || { echo "::error::release $TAG is already published; refusing to upload into it"; exit 1; }
            id=${found% *}
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="TTD $TAG" \
              -f body='Unsigned beta build. See the README for the macOS, Windows and Linux first-launch steps.' -F draft=true -F prerelease=false --jq .id)
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: windows
            platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build the frontend (embedded by tauri build as frontendDist)
        run: bun run build:ui

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          # Root package.json script "tauri" is `cd app && tauri`.
          tauriScript: bun run tauri
          # The draft made by `prepare`; the action only uploads into it.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
