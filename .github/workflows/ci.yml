name: ci

on:
  push:
  pull_request:
  # release.yml runs this as a gate before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the CALLER's name when reused, so the release gate never cancels the tag push's own ci run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: typecheck and bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test store-node/test
      - run: bun test app/test
      - run: bun run build:ui

  # The agent half: manifest validation and the engine-level mod tests (hooks/*.test.ts, in-memory host).
  # `claude plugin test` needs no login (checked locally with an empty HOME); e2e-mod runs real billed
  # `claude -p` sessions and stays a local check (`bun run test:mod`).
  mod:
    name: claude plugin validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned to the build the plugin is checked against (README: 2.1.318).
      - run: npm install -g @anthropic-ai/claude-code@2.1.318
      - run: claude --version
      - run: claude plugin validate plugin
      - run: claude plugin validate .
      - run: claude plugin test plugin

  rust-store:
    name: cargo test ttd-store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      # The store crate needs no webkit; the Tauri shell is tested in rust-app.
      - run: cargo test -p ttd-store

  # The window crate (breadcrumb, watcher, smoke control). Linking Tauri needs the WebKitGTK packages
  # from the Tauri v2 prerequisites (Debian list), and tauri::generate_context! needs app/dist to exist.
  rust-app:
    name: cargo test ttd (Tauri shell)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: bun install --frozen-lockfile
      - run: bun run build:ui
      - run: cargo test -p ttd
