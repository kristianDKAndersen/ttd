[package]
name = "ttd-store"
version = "0.1.0"
edition = "2021"
description = "TTD todo store: STORE.md contract engine (ops, lock, CAS, recovery) and CLI"
publish = false

[lib]
name = "ttd_store"
path = "src/lib.rs"

[[bin]]
name = "ttd-store"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
fastrand = "=2.5.0"
time = { version = "=0.3.55", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "=3.27.0"
